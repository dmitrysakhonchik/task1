<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servlet API Introduction</title>
</head>
<body>
<main>
    <h1>Servlet API Introduction</h1>
    <h2>HelloServlet1 — implements Servlet</h2>
    <form action="hello1" method="get" accept-charset="UTF-8">
        <label for="name1">Name</label>
        <input id="name1" type="text" name="name" placeholder="Enter name">
        <button type="submit">Say hello</button>
    </form>
    <h2>HelloServlet2 — extends HttpServlet</h2>
    <form action="hello2" method="get" accept-charset="UTF-8">
        <label for="name2">Name</label>
        <input id="name2" type="text" name="name" placeholder="Enter name">
        <button type="submit">Say hello</button>
    </form>
    <p>Leave the name empty to receive a greeting for Guest.</p>
</main>
</body>
</html>
